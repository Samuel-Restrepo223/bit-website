            <h1>Contacto</h1>
            <p>
                Si tienes alguna pregunta o deseas ponerte en contacto conmigo, por favor completa el formulario a continuación.
            </p>
            <form>
                <label for="name">Nombre</label>
                <input type="text" id="name" placeholder="Escribe tu nombre" required />
                
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="Escribe tu correo" required />
                
                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" placeholder="Escribe tu mensaje" required></textarea>
                
                <button type="submit">Enviar</button>
            </form>
        </div>
    </main>
